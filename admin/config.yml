backend:
  name: github
  repo: tislars/reisblog
  branch: main

site_url: https://tislars.github.io
display_url: https://tislars.github.io
media_folder: public/uploads

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} · {{place}} · {{title}}'
    sortable_fields: [date, title, place]
    fields:
      - { label: Titel, name: title, widget: string }
      - label: Datum
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: '{{now}}'
      - { label: Plaats, name: place, widget: string, hint: "Bijv. 'Hoi An, Vietnam'. Wordt automatisch op de kaart gezet." }
      - label: Breedtegraad (optioneel)
        name: lat
        widget: number
        value_type: float
        required: false
        hint: Alleen invullen als de plaats op de verkeerde plek op de kaart staat. Vul dan ook lengtegraad in.
      - { label: Lengtegraad (optioneel), name: lng, widget: number, value_type: float, required: false }
      - { label: Coverfoto (optioneel), name: cover, widget: flickr, required: false, hint: "Flickr-foto-URL, of kies er een met 'Kies uit Flickr'. Leeg = eerste foto in de tekst." }
      - label: Feiten (optioneel)
        name: facts
        widget: list
        required: false
        max: 6
        label_singular: Feit
        summary: '{{fields.label}}: {{fields.value}}'
        hint: "Korte feiten van de dag, in je eigen volgorde (slepen om te verplaatsen). Bijv. Aankomst: 8 uur bus, Hoogte: 1.495 m, Gelopen: 14 km. Maximaal 6; label tot 20 tekens, waarde tot 30. Alles is tekst: schrijf het zoals het op de site moet staan."
        fields:
          - { label: Label, name: label, widget: string, hint: "Bijv. 'Aankomst' of 'Temperatuur'. Maximaal 20 tekens.", maxlength: 20 }
          - { label: Waarde, name: value, widget: string, hint: "Bijv. '8 uur bus' of '±25°'. Maximaal 30 tekens.", maxlength: 30 }
      - { label: Concept, name: draft, widget: boolean, default: false, hint: Concepten staan niet op de site. }
      - label: Tekst
        name: body
        widget: markdown
        default: |
          Korte intro: waar ben je en hoe kwam je hier?

          ## Wat we deden

          ## Wat opviel

          ## Tips
        hint: "Schrijfvragen: wat at je, wat verraste je, wie ontmoette je, wat zou je een ander aanraden? Koppen mag je vrij aanpassen of weghalen. Foto's kiezen uit je Flickr: 'Foto uit Flickr' in het Invoegen-menu, op een lege regel (1 foto, of 2–3 naast elkaar). Of handmatig: plak de Flickr-foto-URL (flickr.com/photos/…/1234567890) op een eigen regel. 2 of 3 foto's naast elkaar: gebruik de knop 'Foto's naast elkaar'. Maximaal 30 foto's per post."
